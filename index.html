<!doctype html><html><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fabric Viewer</title>
<style>
  /* パネル開閉の矢印ボタンは使わないので非表示にする */
#uiToggle,
#reopen {
  display: none !important;
}

  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;
            background: radial-gradient(1200px 800px at 60% 40%, #ffffff 0%, #eef1f5 60%, #dde2ea 100%);}
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}

  /* ==== 左パネル（開閉スライド） ==== */
  #uiWrap{position:fixed;z-index:5;top:10px;left:10px;display:flex;align-items:flex-start;transition:transform .25s ease}
  #ui{
    background:rgba(20,20,22,.55);color:#fff;padding:14px;border-radius:16px;max-width:420px;
    border:1px solid rgba(255,255,255,.16);backdrop-filter: blur(10px) saturate(120%);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);}
  #ui label{display:block;font-size:12px;margin:6px 0 4px}
  .btnRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .mini{margin-left:6px;font-size:12px;padding:2px 6px}
  #uiToggle{margin-left:6px;align-self:center;cursor:pointer;border:none;outline:none;width:32px;height:56px;border-radius:8px;
    background:#e23;color:#fff;font-size:20px;line-height:56px;text-align:center;user-select:none;box-shadow:0 2px 8px #0006;
    position:absolute; top:50%; transform:translateY(-50%);}
  #uiWrap.collapsed{transform:translateX(calc(-100% + 32px))}
  #uiWrap.collapsed #uiToggle{position: fixed;left: 8px;top: 50%;transform: translateY(-50%);z-index: 6;width: 40px;height: 64px;font-size:22px;border-radius:10px;}
  .block{margin-top:8px;padding:8px;border:1px solid #ffffff22;border-radius:8px}
  .block h4{margin:0 0 4px 0;font-size:13px}
  #footer{position:fixed;right:10px;bottom:10px;z-index:4;font-size:12px;background:#0b0b0bcc;color:#fff;padding:6px 10px;border-radius:8px}
  #msg{position:fixed;z-index:6;bottom:10px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px}

  /* ==== クリック時の吹き出し ==== */
  #bubble{position:fixed; z-index:7; display:none; transform:translate(-50%,-115%); pointer-events:auto;
    background:#111e; color:#fff; backdrop-filter: blur(4px);border:1px solid #fff3; border-radius:10px; padding:6px 8px; box-shadow:0 4px 16px #0008;}
  #bubble .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:320px}
  .chip{width:56px;height:56px;border-radius:8px;border:1px solid #fff5;background:#222 center/cover no-repeat;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;}
  .chip.none{background:#222}
  .chip:hover{outline:2px solid #fff9}

  /* ==== 右上：履歴サムネ ==== */
  #shots{position:fixed; z-index:8; top:10px; right:10px; display:flex; gap:8px; flex-direction:row-reverse; pointer-events:auto;}
  #shots img{width:96px; height:96px; object-fit:cover; border-radius:10px; border:1px solid #ffffff55;background:#111c; box-shadow:0 2px 10px #0008; cursor:pointer;}
  #shots img:hover{ outline:2px solid #fff9 }

  /* パネル再表示用ボタン */
  #reopen{position:fixed; left:8px; top:50%; transform:translateY(-50%);
    width:40px; height:64px; border:none; border-radius:10px;background:#e23; color:#fff; font-size:22px; line-height:64px; text-align:center;
    box-shadow:0 2px 10px #0008; z-index:9999; cursor:pointer; display:none;}
  body.panel-collapsed #reopen{ display:block; }

  /* ほんのりビネット */
  body::after{content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(1200px 800px at 60% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.06) 100%);mix-blend-mode:multiply;}

  /* ===== 型選択UI（selecting中だけ表示） ===== */
  body.selecting #uiWrap,
  body.selecting #uiToggle,
  body.selecting #reopen,
  body.selecting #shots,
  body.selecting #bubble,
  body.selecting #footer,
  body.selecting #msg,
  body.selecting canvas#c { display:none !important; }

  #patternSelect{position:fixed; inset:0; z-index:20; display:none; place-items:center;}
  /* selecting クラスが付いているときだけ表示 */
body.selecting #patternSelect{
  display:grid;
}
  #backHomeBtn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 8px 14px;
  font-size: 14px;
  color: #fff;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px;
  cursor: pointer;
  z-index: 9999;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}

#backHomeBtn:hover {
  background: rgba(255,255,255,0.15);
}

  #patternSelect .wrap{width:min(1100px, 92vw);}
  #patternSelect h1{margin:0 0 18px; font-weight:700; letter-spacing:.02em;font-size:clamp(20px, 3.2vw, 32px); color:#222a; text-align:center;}
  #patternGrid{display:grid; gap:14px; grid-template-columns: repeat(4, 1fr);}
  .patternCard{display:flex; flex-direction:column; gap:8px;padding:12px; border-radius:14px;background:#fff8; border:1px solid #0001; backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer; transition:transform .08s ease, box-shadow .2s ease;}
  .patternCard:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.18); }
  .patternCard .name{ font-weight:700; color:#222; }
  .patternCard .thumb{aspect-ratio: 4/3; border-radius:10px; border:1px dashed #0002; background:#f6f7fa center/contain no-repeat;}
  .patternCard.disabled{ opacity:.45; cursor:not-allowed; }
  .patternCard.disabled .thumb{ background:#f6f7fa; border-style:solid; }




    /* ==== 下部 プリセットパターン ==== */
  #presets{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:5;
  }
  .presetCard{
    width:120px;
    height:80px;
    border-radius:10px;
    border:1px solid #0002;
    background:#000c;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:#fff;
    font-size:12px;
    padding-bottom:6px;
    opacity:.7;
  }
  .presetCard.active{
    outline:2px solid #fff;
    opacity:1;
  }




  
</style>
</head>
<body class="selecting">

<!-- 型選択レイヤー -->
<div id="patternSelect">
  <div class="wrap">
    <h1>どの服を作製しますか？</h1>
    <div id="patternGrid">
      <button class="patternCard disabled" data-id="RI-1"><div class="name">RI-1</div><div class="thumb"></div></button>
      <button class="patternCard disabled" data-id="RI-2"><div class="name">RI-2</div><div class="thumb"></div></button>
      <button class="patternCard" data-id="RI-3"><div class="name">RI-3</div><div class="thumb" id="thumb-RI3"></div></button>
      <button class="patternCard disabled" data-id="RI-4"><div class="name">RI-4</div><div class="thumb"></div></button>
    </div>
  </div>
</div>

<!-- ===== 左パネル ===== -->
<div id="uiWrap">
  <div id="ui">
    <div style="font-weight:600;margin-bottom:6px">Fabric Viewer</div>
    <div class="btnRow">
      <button id="resetAll" title="割当を全て『なし』・白に戻す">リセット</button>
    </div>


    <!-- A〜E（倍率/回転は削除済み） -->
<div class="block">
  <h4>生地A</h4>
  <div class="btnRow">
    <!-- ここが生地選択ページに飛ぶボタンになる -->
    <button id="changeA" type="button">生地を変更</button>
    <button id="clearA" class="mini" type="button">クリアA</button>
  </div>
</div>

<div class="block">
  <h4>生地B</h4>
  <div class="btnRow">
    <button id="changeB" type="button">生地を変更</button>
    <button id="clearB" class="mini" type="button">クリアB</button>
  </div>
</div>

<div class="block">
  <h4>生地C</h4>
  <div class="btnRow">
    <button id="changeC" type="button">生地を変更</button>
    <button id="clearC" class="mini" type="button">クリアC</button>
  </div>
</div>


  <!--   <div style="margin-top:6px;"><small>※ <code>assets/garment.glb</code> が無い間はキューブ表示 / パーツは3D上をクリックして選択</small></div>  -->
  </div>
</div>


<!-- 右上：履歴サムネ -->
<div id="shots"></div>

<!-- クリック位置に出る吹き出し -->
<div id="bubble">
  <div style="font-size:12px;margin-bottom:4px">生地を割り当て</div>
  <div class="row">
    <button class="chip" id="pickA">A</button>
    <button class="chip" id="pickB">B</button>
    <button class="chip" id="pickC">C</button>
    <button class="chip none" id="pickNone">なし</button>
  </div>
</div>

<div id="presets"></div>

<div id="footer">ドラッグで回転 / ホイールでズーム</div>
<div id="backHomeBtn">← ホームへ戻る</div>
<div id="msg" hidden></div>
<canvas id="c"></canvas>
<div id="patternBar" style="
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  display:flex; gap:12px; z-index:9;
">
  <button class="patternBtn" data-pattern="0">パターン1 (A-B-C)</button>
  <button class="patternBtn" data-pattern="1">パターン2 (A-C-B)</button>
  <button class="patternBtn" data-pattern="2">パターン3 (B-A-C)</button>
  <button class="patternBtn" data-pattern="3">パターン4 (B-C-A)</button>
  <button class="patternBtn" data-pattern="4">パターン5 (C-A-B)</button>
  <button class="patternBtn" data-pattern="5">パターン6 (C-B-A)</button>
</div>

<script src="./assets/threejs/three.min.js"></script>
<script src="./assets/threejs/GLTFLoader.js"></script>
<script src="./assets/threejs/OrbitControls.js"></script>
<script>
/* ========= 基本 ========= */
let GLB_PATH = null;
const $ = (id)=>document.getElementById(id);
const SLOTS = ['A','B','C'];

// ===== ゾーン定義（ゾーン1/2/3 ← マテリアルuuidの集合） =====
let ZONES = null;  // { Z1: [uuid,...], Z2: [...], Z3: [...] }
const ZONE_LS_KEY = 'fv_zones_v1';
let zonesInitialized = false;

function loadZonesFromStorage() {
  try {
    const raw = localStorage.getItem(ZONE_LS_KEY);
    if (!raw) return false;
    ZONES = JSON.parse(raw);
    return true;
  } catch (e) {
    console.warn('ゾーン情報の読み込み失敗', e);
    return false;
  }
}

function saveZonesToStorage() {
  if (!ZONES) return;
  try {
    localStorage.setItem(ZONE_LS_KEY, JSON.stringify(ZONES));
  } catch (e) {
    console.warn('ゾーン情報の保存失敗', e);
  }
}

/**
 * 「今表示されている A/B/C の割り当て」から
 * ゾーン1/2/3 を一度だけ決めて保存する。
 * （最初の一回だけ実行される）
 */
function initZonesFromCurrentAssignOnce() {
  if (zonesInitialized) return;           // もう済んでいたら何もしない
  zonesInitialized = true;

  // 既に保存済みならそれを使う
  if (loadZonesFromStorage()) {
    console.log('ZONES 読み込み済み', ZONES);
    return;
  }

  // まだ無ければ「現在の assign 状態」から決める
  ZONES = { Z1: [], Z2: [], Z3: [] };

  targetMats.forEach(m => {
    const k = assign[m.uuid];  // 'A' / 'B' / 'C' / '—' / undefined
    if (k === 'A') {
      ZONES.Z1.push(m.uuid);
    } else if (k === 'B') {
      ZONES.Z2.push(m.uuid);
    } else if (k === 'C') {
      ZONES.Z3.push(m.uuid);
    }
  });

  saveZonesToStorage();
  console.log('ZONES を現在の割り当てから作成しました', ZONES);
}

// ===== URLパラメータ（生地IDと型ID） =====
const params = new URLSearchParams(window.location.search);
const fabricsParam = params.get('fabrics') || '';        // 例: "S-100,S-101,S-102"
const patternParam = params.get('pattern') || 'RI-3';    // 無ければ RI-3

// URL から渡ってきた A/B/C の生地ID
const initialFabrics = fabricsParam
  ? fabricsParam.split(',').map(s => s.trim()).filter(Boolean).slice(0, 3)
  : [];

// A/B/C 各スロットに今どの生地IDが入っているか
const slotFabricIds = {
  A: initialFabrics[0] || null,
  B: initialFabrics[1] || null,
  C: initialFabrics[2] || null,
};

// いま表示している型（RI-1, RI-2, RI-3, RI-4 など）
let currentPatternId = patternParam;
  
// ID → 画像パスを自動で組み立てる
const FABRIC_EXT = '.jpg';
function fabricIdToUrl(id) {
  return `./assets/fabrics/${id}${FABRIC_EXT}`;
}

// 型ごとの定義
const PATTERNS = {
  'RI-1': null,
  'RI-2': null,
  'RI-3': { glb: './assets/garment.glb', thumb: null },
  //'RI-3': { glb: './assets/garment.glb', thumb: './assets/thumbs/RI-3.png' },
  'RI-4': null
};

/* three.js */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
if (renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene(); scene.background = null;
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100); camera.position.set(0,1.6,3.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x223,0.45));

const dir = new THREE.DirectionalLight(0xfff2e0, 0.85);
dir.castShadow = true;
dir.position.set(1, 1, 1).multiplyScalar(10);
const camAim = new THREE.Object3D(); camAim.position.set(0,0,-1); camera.add(camAim);
dir.target = camAim; camera.add(dir);
dir.shadow.mapSize.set(1024,1024); dir.shadow.camera.near=0.1; dir.shadow.camera.far=20; dir.shadow.bias=-0.0005;

const fill = new THREE.DirectionalLight(0xffffff, 0.45); fill.position.set(-3,2.5,-2); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(0,3,-4); scene.add(rim);

controls.enablePan = false; if ('zoomToCursor' in controls) controls.zoomToCursor = false;

/* モデル */
let model, targetMats = [];

/* モデルを読む関数（選択後に呼ぶ） */
function loadModel(path){
  const loader = new THREE.GLTFLoader();
  loader.load(
    path,
    (glb) => {
      const json = glb.parser?.json || {};
      console.log('[GLB INFO] extensionsUsed:', json.extensionsUsed || []);
      console.table((json.images || []).map((im,i)=>({i, mime:im.mimeType||'(unknown)', uri:im.uri?im.uri:'(embedded)'})));
      window.__glbinfo = { used: json.extensionsUsed||[], images: json.images||[] };

      model = glb.scene;
      scene.add(model);
      enableShadows(model);
      addGroundUnder(model);
      analyze(model);
      fit(model);
      msg('garment.glb を読み込みました');
      loadAssignFromStorage();
      applyAssignments();
      // ★プリセットボタンを初期化（最初の1回だけでよければガードしてもOK）
      initPresetButtons();
      // ★ A/B/C 割り当てを反映したあとに、ゾーン定義を一度だけ作成/読み込み
      initZonesFromCurrentAssignOnce();

    },
    undefined,
    (err) => {
      console.error('GLB load failed:', err);
      msg('GLB読み込みエラー： ' + (err?.message || err));
      const g = new THREE.BoxGeometry(1, 1.2, 0.5);
      const m = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.1, roughness: 0.7 });
      const cube = new THREE.Mesh(g, m);
      scene.add(cube);
      targetMats = [cube.material];
      enableShadows(cube);
      addGroundUnder(cube);
      updateMatInfo();
      loadAssignFromStorage();
      applyAssignments();
      msg('assets/garment.glb が無い/読めないのでキューブ表示');
    }
  );
}

// ----- 影用ユーティリティ -----
function enableShadows(root){
  root.traverse(o=>{
    if(o.isMesh){ o.castShadow = true; o.receiveShadow = false; }
  });
}

let ground;
function addGroundUnder(root){
  if(ground && ground.parent) ground.parent.remove(ground);
  const box = new THREE.Box3().setFromObject(root);
  const minY = box.min.y;
  const g = new THREE.PlaneGeometry(20, 20);
  const m = new THREE.ShadowMaterial({ opacity: 0.25 });
  ground = new THREE.Mesh(g, m);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, minY - 0.002, 0);
  ground.receiveShadow = true;
  ground.userData.ground = true;
  scene.add(ground);
}

/* ===== ユーティリティ ===== */
function isSupportedMat(m){
  return !!m && (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial || m.isMeshLambertMaterial || m.isMeshPhongMaterial || m.isMeshBasicMaterial);
}
const materialUseCount = new Map();
function analyze(root){
  const mats=new Set(); materialUseCount.clear();
  root.traverse(o=>{
    if(o.isMesh && o.material){
      if(Array.isArray(o.material)){
        o.material.forEach(m=>{ if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }});
      }else{
        const m=o.material; if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }
      }
    }
  });
  targetMats = Array.from(mats).filter(isSupportedMat);
  updateMatInfo();
    // ★初回セットアップ用：コンソールに material.uuid を出す
  logMaterialsForZoneSetup();

}
function updateMatInfo(){
  const el = $('matinfo');
  if (el) el.textContent = `適用対象: ${targetMats.length} material(s)`;
}
function fit(obj){
  const box=new THREE.Box3().setFromObject(obj),
        size=box.getSize(new THREE.Vector3()).length(),
        center=box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  const dist=size*0.6/Math.tan((Math.PI*camera.fov)/360);
  camera.position.copy(center.clone().add(new THREE.Vector3(0,size*0.1,dist)));
  camera.near=size/100; camera.far=size*10; camera.updateProjectionMatrix(); controls.update();
}

const texLoader = new THREE.TextureLoader();
const state = {
  A:{ tex:null, url:'' },
  B:{ tex:null, url:'' },
  C:{ tex:null, url:'' },
};

// ===== パーツを3つのゾーン(Z1/Z2/Z3)に分けるための設定 =====
// key: material.uuid -> 'Z1' | 'Z2' | 'Z3'
const MAT_ZONE = {};

// コンソールで uuid を把握するためのヘルパ（あとで説明する）
function logMaterialsForZoneSetup() {
  console.log('--- material list for MAT_ZONE ---');
  targetMats.forEach(m => {
    console.log(m.name || '(no-name)', m.uuid);
  });
  console.log('上の uuid を見ながら MAT_ZONE に Z1/Z2/Z3 を割り当ててください。');
}

// 3つのゾーンに対する 6通りのパターン（A/B/C の入れ替え）
const PRESETS = [
  { id:'p1', name:'A-B-C', zoneToSlot:{ Z1:'A', Z2:'B', Z3:'C' } },
  { id:'p2', name:'A-C-B', zoneToSlot:{ Z1:'A', Z2:'C', Z3:'B' } },
  { id:'p3', name:'B-A-C', zoneToSlot:{ Z1:'B', Z2:'A', Z3:'C' } },
  { id:'p4', name:'B-C-A', zoneToSlot:{ Z1:'B', Z2:'C', Z3:'A' } },
  { id:'p5', name:'C-A-B', zoneToSlot:{ Z1:'C', Z2:'A', Z3:'B' } },
  { id:'p6', name:'C-B-A', zoneToSlot:{ Z1:'C', Z2:'B', Z3:'A' } },
];


// ===== URLから生地画像を読み込む =====
function loadTexFromUrlFor(key, url){
  if (!state[key]) return;

  state[key].url = url;
  state[key].tex = texLoader.load(url, ()=>{
    prepTexture(state[key].tex);
    applyAssignments();
    updateBubblePreviews();
    msg(`生地${key}（URL）を読み込みました`);
  });
}

// ===== URLから渡された生地を A/B/C に自動セット =====
(function initFromBase(){
  if (!initialFabrics.length) return;

  const slotOrder = ['A','B','C'];
  console.log('BASEから渡ってきた生地ID:', initialFabrics);

  initialFabrics.forEach((id, idx)=>{
    const slot = slotOrder[idx];
    if (!slot) return;

    const url = fabricIdToUrl(id);
    slotFabricIds[slot] = id;          // どのスロットに何のIDが入ったか覚える
    loadTexFromUrlFor(slot, url);
  });
})();

const assign = {}; // material.uuid -> 'A'|'B'|'C'|'—'
const LS_KEYS = { assign:'fv_assign_v1', ui:'uiCollapsed' };

function saveAssignToStorage(){ try{ localStorage.setItem(LS_KEYS.assign, JSON.stringify(assign)); }catch(e){} }
function loadAssignFromStorage(){
  try{
    const raw = localStorage.getItem(LS_KEYS.assign);
    if(!raw) return;
    const obj = JSON.parse(raw);
    Object.keys(obj).forEach(k=>{ assign[k] = obj[k]; });
  }catch(e){}
}

function prepTexture(t){
  if(!t) return;
  if (t.colorSpace!==undefined) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
}
function applyAssignments(){
  targetMats.forEach(m=>{
    const key = assign[m.uuid];
    const tex = (key && state[key]) ? state[key].tex : null;
    if(isSupportedMat(m)){
      if(!tex || key==='—'){ m.map = null; if(m.color) m.color.set(0xffffff); }
      else { m.map = tex; }
      m.needsUpdate = true;
      if(typeof m.metalness==='number') m.metalness=Math.min(m.metalness,0.15);
      if(typeof m.roughness==='number') m.roughness=Math.max(m.roughness,0.6);
    }
  });
  saveAssignToStorage();
  debounceMaybeCapture();
}


// ===== プリセット適用 =====
function applyPreset(preset) {
  // いったん今の assign を全クリア
  Object.keys(assign).forEach(k => delete assign[k]);

  targetMats.forEach(m => {
    const zone = MAT_ZONE[m.uuid];      // このマテリアルがどのゾーンか
    if (!zone) {
      // ゾーン未指定 → 今は「生地なし」にしておく
      assign[m.uuid] = '—';
      return;
    }
    const slot = preset.zoneToSlot[zone];   // そのゾーンに割り当てる生地(A/B/C)
    assign[m.uuid] = slot || '—';
  });

  applyAssignments();
  msg(`プリセット「${preset.name}」を適用しました`);
}

/* ====== スクショ履歴 ====== */
const MAX_SHOTS = 6;
const shotsBox = $('shots');
let lastShotSig = '';
let shotDebounce;
let lastOpWasNone = false;

function currentSignature(){
  return targetMats.map(m=>{
    const k = assign[m.uuid];
    return (k && state[k] && state[k].tex) ? `${m.uuid}:${k}` : `${m.uuid}:-`;
  }).join('|');
}
function allFabricCovered(){
  if (targetMats.length === 0) return false;
  return targetMats.every(m=>{
    const k = assign[m.uuid];
    return !!(k && k !== '—' && state[k] && state[k].tex);
  });
}
function debounceMaybeCapture(){
  clearTimeout(shotDebounce);
  shotDebounce = setTimeout(()=>{
    if (lastOpWasNone){ lastOpWasNone=false; return; }
    if (!allFabricCovered()) return;
    const sig = currentSignature();
    if(sig===lastShotSig) return;
    captureShot(sig);
  }, 250);
}
function captureShot(sig){
  renderer.render(scene,camera);
  const dataUrl = renderer.domElement.toDataURL('image/png');
  const img = new Image();
  img.src = dataUrl;
  img.title = 'クリックで復元';
  const snap = { assign: {...assign} };
  img.dataset.snap = JSON.stringify(snap);
  img.onclick = ()=>{
    const s = JSON.parse(img.dataset.snap);
    Object.keys(assign).forEach(k=>delete assign[k]);
    Object.assign(assign, s.assign);
    applyAssignments();
    msg('履歴から復元しました');
  };
  shotsBox.prepend(img);
  while(shotsBox.children.length>MAX_SHOTS) shotsBox.removeChild(shotsBox.lastChild);
  lastShotSig = sig;
}

/* ===== クリックでパーツ選択 → 吹き出し（裏面は無効） ===== */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pick = null, overlay = null, pickMatIndex = null;
const bubble = $('bubble');
const chipEls = { A:$('pickA'), B:$('pickB'), C:$('pickC'), None:$('pickNone') };

function updateBubblePreviews(){

const _nm = new THREE.Matrix3();
function isFrontFacing(hit){
  if(!hit.face || !hit.object) return true;
  const n = hit.face.normal.clone().applyMatrix3(_nm.getNormalMatrix(hit.object.matrixWorld)).normalize();
  const camDir = camera.position.clone().sub(hit.point).normalize();
  return n.dot(camDir) > 0.15;
}
function showHighlight(mesh){
  hideHighlight();
  if(!mesh || !mesh.geometry) return;
  const mat = new THREE.MeshBasicMaterial({color:0xff6b81, transparent:true, opacity:0.35, depthTest:false, depthWrite:false});
  overlay = new THREE.Mesh(mesh.geometry, mat);
  overlay.renderOrder = 9999; mesh.add(overlay);
}
function hideHighlight(){ if(overlay && overlay.parent){ overlay.parent.remove(overlay); } overlay = null; }
function hideBubble(){ bubble.style.display='none'; }
function setBubbleScreenPos(world){
  const p = world.clone().project(camera);
  const x = (p.x * .5 + .5) * canvas.clientWidth;
  const y = ( -p.y * .5 + .5) * canvas.clientHeight;
  bubble.style.left = `${x}px`; bubble.style.top  = `${y}px`;
}
function onCanvasClick(ev){
  const r = canvas.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left)/r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top)/r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const targets = []; scene.traverse(o=>{ if(o.isMesh && !o.userData?.ground) targets.push(o); });
  const hits = ray.intersectObjects(targets, true);
  const hit = hits.find(h => h.object && h.object.material && isFrontFacing(h));
  if(!hit){ pick=null; pickMatIndex=null; hideHighlight(); hideBubble(); return; }
  pick = hit.object;
  pickMatIndex = (Array.isArray(pick.material) && hit.face && typeof hit.face.materialIndex==='number') ? hit.face.materialIndex : null;
  showHighlight(pick);
  const wp = hit.point.clone().add(new THREE.Vector3(0, 0.02, 0));
  setBubbleScreenPos(wp); bubble.style.display='block'; controls.update();
}
canvas.addEventListener('pointerdown', onCanvasClick);

function ensureUniqueMaterialOnMesh(mesh, idx){
  if(Array.isArray(mesh.material)){
    const old = mesh.material[idx]; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material[idx] = clone;
      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone); return clone;
    } return old;
  }else{
    const old = mesh.material; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material = clone;
      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone); return clone;
    } return old;
  }
}
function assignToSelected(key){
  if(!pick || !pick.material) return;
  let mat = null;
  if(Array.isArray(pick.material)){
    const idx = (pickMatIndex!=null) ? pickMatIndex : 0;
    mat = ensureUniqueMaterialOnMesh(pick, idx);
  }else{
    mat = ensureUniqueMaterialOnMesh(pick, 0);
  }
  if(!mat) return;
  assign[mat.uuid] = key;
  lastOpWasNone = (key === '—');
  applyAssignments();
}

// ゾーン1/2/3 に対して A/B/C をどう当てるか
const PATTERN_PERMS = [
  { label: 'パターン1 (A-B-C)', Z1: 'A', Z2: 'B', Z3: 'C' },
  { label: 'パターン2 (A-C-B)', Z1: 'A', Z2: 'C', Z3: 'B' },
  { label: 'パターン3 (B-A-C)', Z1: 'B', Z2: 'A', Z3: 'C' },
  { label: 'パターン4 (B-C-A)', Z1: 'B', Z2: 'C', Z3: 'A' },
  { label: 'パターン5 (C-A-B)', Z1: 'C', Z2: 'A', Z3: 'B' },

];

/**
 * 指定パターン番号 (0〜5) を適用
 */
function applyPatternByIndex(index) {
  if (!ZONES) {
    msg('ゾーン情報がまだ定義されていません');
    return;
  }
  const perm = PATTERN_PERMS[index];
  if (!perm) return;

  // いったん assign をクリア
  Object.keys(assign).forEach(k => { delete assign[k]; });

  // ゾーン1 → perm.Z1 の生地
  (ZONES.Z1 || []).forEach(uuid => {
    assign[uuid] = perm.Z1;
  });
  // ゾーン2 → perm.Z2 の生地
  (ZONES.Z2 || []).forEach(uuid => {
    assign[uuid] = perm.Z2;
  });
  // ゾーン3 → perm.Z3 の生地
  (ZONES.Z3 || []).forEach(uuid => {
    assign[uuid] = perm.Z3;
  });

  applyAssignments();
  msg(perm.label + ' を適用しました');
}

// GLBから2Dサムネを生成（フォールバック）
function makeThumbFromGLB(glbPath, targetEl){
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  const W=360, H=270; r.setSize(W,H,false); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0xffffff);
  const cam = new THREE.PerspectiveCamera(20, W/H, 0.1, 100);
  sc.add(new THREE.HemisphereLight(0xffffff,0x223,0.6));
  const dl  = new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(2,3,5); sc.add(dl);

  const ld = new THREE.GLTFLoader();
  ld.load(glbPath, (glb)=>{
    const obj = glb.scene; sc.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    const radius = Math.max(size.x, size.y, size.z) * 0.6;
    cam.position.set(0, 0.1*size.y, radius*3.0);
    cam.lookAt(0,0,0); cam.updateProjectionMatrix();
    r.render(sc, cam);
    targetEl.style.backgroundImage = `url(${r.domElement.toDataURL('image/png')})`;
    r.dispose();
  }, undefined, ()=>{});
}
