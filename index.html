<!doctype html><html><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fabric Viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;
            background: radial-gradient(1200px 800px at 60% 40%, #ffffff 0%, #eef1f5 60%, #dde2ea 100%);
  }
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}

  /* ==== 左パネル（開閉スライド） ==== */
  #uiWrap{position:fixed;z-index:5;top:10px;left:10px;display:flex;align-items:flex-start;transition:transform .25s ease}
  /*#ui{background:#0b0b0bcc;color:#fff;padding:12px;border-radius:10px;max-width:420px}*/
  #ui{
  background:rgba(20,20,22,.55);
  color:#fff;
  padding:14px;
  border-radius:16px;
  max-width:420px;
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(10px) saturate(120%);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
  #ui label{display:block;font-size:12px;margin:6px 0 4px}
  #ui input[type="range"]{width:220px}
  .btnRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .mini{margin-left:6px;font-size:12px;padding:2px 6px}

  #uiToggle{margin-left:6px;align-self:center;cursor:pointer;border:none;outline:none;width:32px;height:56px;border-radius:8px;
  background:#e23;color:#fff;font-size:20px;line-height:56px;text-align:center;user-select:none;box-shadow:0 2px 8px #0006;
  position:absolute; top:50%; transform:translateY(-50%);}

  #uiWrap.collapsed{transform:translateX(calc(-100% + 32px))}

#uiWrap.collapsed #uiToggle{
  position: fixed;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 6;
  width: 40px; height: 64px;   /* クリックしやすく */
  font-size: 22px;
  border-radius: 10px;
}
  
  .block{margin-top:8px;padding:8px;border:1px solid #ffffff22;border-radius:8px}
  .block h4{margin:0 0 4px 0;font-size:13px}

  #footer{position:fixed;right:10px;bottom:10px;z-index:4;font-size:12px;background:#0b0b0bcc;color:#fff;padding:6px 10px;border-radius:8px}
  #msg{position:fixed;z-index:6;bottom:10px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px}

  /* ==== クリック時の吹き出し ==== */
  #bubble{
    position:fixed; z-index:7; display:none; transform:translate(-50%,-115%); pointer-events:auto;
    background:#111e; color:#fff; backdrop-filter: blur(4px);
    border:1px solid #fff3; border-radius:10px; padding:6px 8px; box-shadow:0 4px 16px #0008;
  }
  #bubble .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:320px}
  .chip{
    width:56px;height:56px;border-radius:8px;border:1px solid #fff5;background:#222 center/cover no-repeat;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;
  }
  .chip.none{background:#222}
  .chip:hover{outline:2px solid #fff9}

  /* ==== 右上：履歴サムネ ==== */
  #shots{
    position:fixed; z-index:8; top:10px; right:10px; display:flex; gap:8px; flex-direction:row-reverse;
    pointer-events:auto;
  }
  #shots img{
    width:96px; height:96px; object-fit:cover; border-radius:10px; border:1px solid #ffffff55;
    background:#111c; box-shadow:0 2px 10px #0008; cursor:pointer;
  }
  #shots img:hover{ outline:2px solid #fff9 }

  
  /* === ビューワーモード用 === */
.viewer #ui .block { display: none; }         /* 詳細スライダー群を隠す */
.viewer #simpleTray { display: grid !important; }

#simpleTray {
  display:none;
  grid-template-columns: repeat(auto-fill,minmax(100px,1fr));
  gap:8px; margin-top:8px;
}
.simpleCard {
  border:1px solid #ffffff33;border-radius:10px;padding:8px;text-align:center;
  cursor:pointer;background:#111c;color:#fff;
}
.simpleCard .ph {
  width:100%;aspect-ratio:1/1;border-radius:8px;background:#222 center/cover no-repeat;
  border:1px solid #ffffff22;
}
.simpleActions{display:flex;gap:8px;margin-top:8px}
.simpleActions button{flex:1}

/* パネル再表示用の浮遊ボタン（畳んだ時だけ出る） */
#reopen{
  position:fixed; left:8px; top:50%; transform:translateY(-50%);
  width:40px; height:64px; border:none; border-radius:10px;
  background:#e23; color:#fff; font-size:22px; line-height:64px; text-align:center;
  box-shadow:0 2px 10px #0008; z-index:9999; cursor:pointer; display:none;
}
body.panel-collapsed #reopen{ display:block; }

/* ほんのりビネット（四隅がすこし落ちる） */
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(1200px 800px at 60% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.06) 100%);
  mix-blend-mode:multiply;
}


  


/* ===== 型選択UI ===== */
body.selecting #uiWrap,
body.selecting #reopen,
body.selecting #shots,
body.selecting #bubble,
body.selecting #footer,
body.selecting #msg,
body.selecting canvas#c { display:none !important; }

#patternSelect{
  position:fixed; inset:0; z-index:20; display:grid; place-items:center;
  /* 背景は既存のグラデが見えるので透明 */
}
#patternSelect .wrap{
  width:min(1100px, 92vw);
}
#patternSelect h1{
  margin:0 0 18px; font-weight:700; letter-spacing:.02em;
  font-size:clamp(20px, 3.2vw, 32px);
  color:#222a; text-align:center;
}
#patternGrid{
  display:grid; gap:14px;
  grid-template-columns: repeat(4, 1fr);
}
.patternCard{
  display:flex; flex-direction:column; gap:8px;
  padding:12px; border-radius:14px;
  background:#fff8; border:1px solid #0001; backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  cursor:pointer; transition:transform .08s ease, box-shadow .2s ease;
}
.patternCard:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.18); }
.patternCard .name{ font-weight:700; color:#222; }
.patternCard .thumb{
  aspect-ratio: 4/3; border-radius:10px; border:1px dashed #0002;
  background:#f6f7fa center/contain no-repeat;
}
.patternCard.disabled{ opacity:.45; cursor:not-allowed; }
.patternCard.disabled .thumb{ background:#f6f7fa; border-style:solid; }



  
  
</style>
</head><body>



<div id="patternSelect">
  <div class="wrap">
    <h1>どの服を作製しますか？</h1>
    <div id="patternGrid">
      <button class="patternCard disabled" data-id="RI-1">
        <div class="name">RI-1</div>
        <div class="thumb"></div>
      </button>
      <button class="patternCard disabled" data-id="RI-2">
        <div class="name">RI-2</div>
        <div class="thumb"></div>
      </button>
      <button class="patternCard" data-id="RI-3">
        <div class="name">RI-3</div>
        <div class="thumb" id="thumb-RI3"></div>
      </button>
      <button class="patternCard disabled" data-id="RI-4">
        <div class="name">RI-4</div>
        <div class="thumb"></div>
      </button>
    </div>
  </div>
</div>







<!-- ===== 左パネル ===== -->
<div id="uiWrap">
  <div id="ui">
    <div style="font-weight:600;margin-bottom:6px">Fabric Viewer</div>

    <div class="btnRow">
      <button id="resetCam">カメラリセット</button>
      <button id="resetAll" title="倍率/回転を初期化・割り当てを全て『なし』・見た目を白に戻す">リセット</button>
      <button id="shot" title="今の画面をPNG保存">スクショPNG</button>
      <button id="viewMode" title="お客さん向けに簡単表示">👀 ビューワーモード</button>
      <small id="matinfo" style="margin-left:auto;"></small>
    </div>

    <!-- A -->
    <div class="block">
      <h4>生地A</h4>
      <div class="btnRow">
        <label style="margin:0"><input id="texA" type="file" accept="image/*"></label>
        <button id="clearA" class="mini" type="button">クリアA</button>
      </div>
    </div>

    <!-- B -->
    <div class="block">
      <h4>生地B</h4>
      <div class="btnRow">
        <label style="margin:0"><input id="texB" type="file" accept="image/*"></label>
        <button id="clearB" class="mini" type="button">クリアB</button>
      </div>
    </div>

    <!-- C -->
    <div class="block">
      <h4>生地C</h4>
      <div class="btnRow">
        <label style="margin:0"><input id="texC" type="file" accept="image/*"></label>
        <button id="clearC" class="mini" type="button">クリアC</button>
      </div>
    </div>

    <!-- D -->
    <div class="block">
      <h4>生地D</h4>
      <div class="btnRow">
        <label style="margin:0"><input id="texD" type="file" accept="image/*"></label>
        <button id="clearD" class="mini" type="button">クリアD</button>
      </div>
    </div>

    <!-- E -->
    <div class="block">
      <h4>生地E</h4>
      <div class="btnRow">
        <label style="margin:0"><input id="texE" type="file" accept="image/*"></label>
        <button id="clearE" class="mini" type="button">クリアE</button>
      </div>
    </div>

    <div style="margin-top:6px;"><small>※ <code>assets/garment.glb</code> が無い間はキューブ表示 / パーツは3D上をクリックして選択</small></div>
  </div>

  <button id="uiToggle" aria-label="toggle panel">‹</button>
  
  <div id="simpleTray">
  <div class="simpleCard" data-slot="A"><div class="ph" id="phA"></div><div>A</div></div>
  <div class="simpleCard" data-slot="B"><div class="ph" id="phB"></div><div>B</div></div>
  <div class="simpleCard" data-slot="C"><div class="ph" id="phC"></div><div>C</div></div>
  <div class="simpleCard" data-slot="D"><div class="ph" id="phD"></div><div>D</div></div>
  <div class="simpleCard" data-slot="E"><div class="ph" id="phE"></div><div>E</div></div>
  <div class="simpleActions" style="grid-column:1/-1">
    <button id="applyAll" title="割当済みのパーツすべてを同じスロットに">全適用</button>
    <button id="resetLite">白に戻す</button>
  </div>
</div>

</div>

<button id="reopen" aria-label="open panel">›</button>

<!-- 右上：履歴サムネ -->
<div id="shots"></div>

<!-- クリック位置に出る吹き出し（A〜E + なし） -->
<div id="bubble">
  <div style="font-size:12px;margin-bottom:4px">生地を割り当て</div>
  <div class="row">
    <button class="chip" id="pickA">A</button>
    <button class="chip" id="pickB">B</button>
    <button class="chip" id="pickC">C</button>
    <button class="chip" id="pickD">D</button>
    <button class="chip" id="pickE">E</button>
    <button class="chip none" id="pickNone">なし</button>
  </div>
</div>

<div id="footer">ドラッグで回転 / ホイールでズーム</div>

<div id="msg" hidden></div>
<canvas id="c"></canvas>

<script src="./assets/threejs/three.min.js"></script>
<script src="./assets/threejs/GLTFLoader.js"></script>
<script src="./assets/threejs/OrbitControls.js"></script>

<script>
/* ========= 基本 ========= */
let GLB_PATH = null; // ← 選択後にセットする
const $ = (id)=>document.getElementById(id);
const SLOTS = ['A','B','C','D','E'];

// 型ごとの定義（必要に応じてパスを差し替え）
const PATTERNS = {
  'RI-1': null,
  'RI-2': null,
  'RI-3': { glb: './assets/garment.glb', thumb: './assets/thumbs/RI-3.png' },
  'RI-4': null
};


/* three.js */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // 影を柔らかく
  
// まぶしさを抑える（白衣が飛びにくく）
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9; // 0.85〜1.0で好み調整

if (renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = null;  // 背景はCSSのグラデに任せる
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100); camera.position.set(0,1.6,3.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(camera);  // ← カメラをシーン階層に入れる（この後ライトをぶら下げるため）
scene.add(new THREE.HemisphereLight(0xffffff,0x223,0.45)); // 少し弱める


// 常に「画面の右上」から当たるライト（カメラ基準）
const dir = new THREE.DirectionalLight(0xfff2e0, 0.85); // ほんのり暖色＆少し弱め

dir.castShadow = true; // 影を使っているなら有効のままでOK（未使用ならあっても害なし）

// カメラ座標で右上前方（1,1,1）方向から当てる
dir.position.set(1, 1, 1).multiplyScalar(10);

// ライトの向き（target）もカメラの正面を見るように固定
const camAim = new THREE.Object3D();
camAim.position.set(0, 0, -1);  // カメラの「前」
camera.add(camAim);
dir.target = camAim;

// ライトをカメラの子にする → カメラが回転・移動しても、画面右上から当たり続ける
camera.add(dir);

// 主光源の影を有効化
dir.castShadow = true;
dir.shadow.mapSize.set(1024,1024);
dir.shadow.camera.near = 0.1;
dir.shadow.camera.far  = 20;
dir.shadow.bias = -0.0005;  // 影の黒スジ軽減


// 柔らかい補助光（左奥から）
const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-3, 2.5, -2);
scene.add(fill);

// 背面のリムライト（輪郭を少し浮かせる）
const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(0, 3, -4);
scene.add(rim);

  
// ★中央固定のため：パンを禁止（右ドラッグ・二本指の平行移動を無効）
controls.enablePan = false;
// ★ズームがカーソル位置へ寄らないように（バージョンによって存在しない場合もあるので安全に）
if ('zoomToCursor' in controls) controls.zoomToCursor = false;


/* モデル */
let model, targetMats = [];
const loader = new THREE.GLTFLoader();
/* モデルを読む関数（選択後に呼ぶ） */
function loadModel(path){
  const loader = new THREE.GLTFLoader();
  loader.load(
    path,
    (glb) => {
      const json = glb.parser?.json || {};
      const used = json.extensionsUsed || [];
      const images = (json.images || []).map((im, i) => ({
        i, mime: im.mimeType || '(unknown)', uri: im.uri ? im.uri : '(embedded bufferView)',
      }));
      console.log('[GLB INFO] extensionsUsed:', used);
      console.table(images);
      window.__glbinfo = { used, images };

      model = glb.scene;
      scene.add(model);
      enableShadows(model);
      addGroundUnder(model);
      analyze(model);
      fit(model);
      msg('garment.glb を読み込みました');
      loadAssignFromStorage();
      applyAssignments();
    },
    undefined,
    (err) => {
      console.error('GLB load failed:', err);
      msg('GLB読み込みエラー： ' + (err?.message || err));
      const g = new THREE.BoxGeometry(1, 1.2, 0.5);
      const m = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.1, roughness: 0.7 });
      const cube = new THREE.Mesh(g, m);
      scene.add(cube);
      targetMats = [cube.material];
      enableShadows(cube);
      addGroundUnder(cube);
      updateMatInfo();
      loadAssignFromStorage();
      applyAssignments();
      msg('assets/garment.glb が無い/読めないのでキューブ表示');
    }
  );
}

  undefined,
  (err) => {
    // ★ ここを少し強化：エラーの中身をはっきり表示
    console.error('GLB load failed:', err);
    msg('GLB読み込みエラー： ' + (err?.message || err));

    // フォールバックのキューブ表示（あなたの元の処理）
    const g = new THREE.BoxGeometry(1, 1.2, 0.5);
    const m = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.1, roughness: 0.7 });
    const cube = new THREE.Mesh(g, m);
    scene.add(cube);
    targetMats = [cube.material];
    enableShadows(cube);
    addGroundUnder(cube);
    updateMatInfo();
    loadAssignFromStorage();
    applyAssignments();
    msg('assets/garment.glb が無い/読めないのでキューブ表示');
  }
);

// ----- 影用ユーティリティ -----
function enableShadows(root){
  root.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true;      // 服は影を落とす
      o.receiveShadow = false;  // 服自体は受け影しない（厚みモデルだと不自然になりやすい）
    }
  });
}

let ground;   // 受け影用の床
function addGroundUnder(root){
  if(ground && ground.parent) ground.parent.remove(ground);

  const box = new THREE.Box3().setFromObject(root);
  const minY = box.min.y;

  const g = new THREE.PlaneGeometry(20, 20);
  const m = new THREE.ShadowMaterial({ opacity: 0.25 }); // 影だけ見せる透明材
  ground = new THREE.Mesh(g, m);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, minY - 0.002, 0);  // ほんの少し下に
  ground.receiveShadow = true;
  ground.userData.ground = true;  // ← レイキャスト対象から除外する印
  scene.add(ground);
}


/* ===== ユーティリティ ===== */
function isSupportedMat(m){
  return !!m && (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial || m.isMeshLambertMaterial || m.isMeshPhongMaterial || m.isMeshBasicMaterial);
}

/* マテリアル抽出（使用数カウントつき） */
const materialUseCount = new Map();
function analyze(root){
  const mats=new Set();
  materialUseCount.clear();
  root.traverse(o=>{
    if(o.isMesh && o.material){
      if(Array.isArray(o.material)){
        o.material.forEach(m=>{ if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }});
      }else{
        const m=o.material; if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }
      }
    }
  });
  targetMats = Array.from(mats).filter(isSupportedMat);
  updateMatInfo();
}
function updateMatInfo(){ $('matinfo').textContent = `適用対象: ${targetMats.length} material(s)`; }

/* カメラ */
function fit(obj){
  const box=new THREE.Box3().setFromObject(obj),
        size=box.getSize(new THREE.Vector3()).length(),
        center=box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  const dist=size*0.6/Math.tan((Math.PI*camera.fov)/360);
  camera.position.copy(center.clone().add(new THREE.Vector3(0,size*0.1,dist)));
  camera.near=size/100; camera.far=size*10; camera.updateProjectionMatrix(); controls.update();
}

/* ===== A〜E の状態 & 永続化 ===== */
const texLoader = new THREE.TextureLoader();
const state = {
  A:{ tex:null, url:'', fileEl:$('texA') },
  B:{ tex:null, url:'', fileEl:$('texB') },
  C:{ tex:null, url:'', fileEl:$('texC') },
  D:{ tex:null, url:'', fileEl:$('texD') },
  E:{ tex:null, url:'', fileEl:$('texE') },
};
const assign = {}; // material.uuid -> 'A'|'B'|'C'|'D'|'E'|'—'

const LS_KEYS = { assign:'fv_assign_v1', ui:'uiCollapsed' };

function saveAssignToStorage(){ try{ localStorage.setItem(LS_KEYS.assign, JSON.stringify(assign)); }catch(e){} }
function loadAssignFromStorage(){
  try{
    const raw = localStorage.getItem(LS_KEYS.assign);
    if(!raw) return;
    const obj = JSON.parse(raw);
    Object.keys(obj).forEach(k=>{ assign[k] = obj[k]; });
  }catch(e){}
}

/* テクスチャ前処理＆適用 */
function prepTexture(t){
  if(!t) return;
  if (t.colorSpace!==undefined) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
}
function applyAssignments(){
  targetMats.forEach(m=>{
    const key = assign[m.uuid];
    const tex = (key && state[key]) ? state[key].tex : null;
    if(isSupportedMat(m)){
      if(!tex || key==='—'){ m.map = null; if(m.color) m.color.set(0xffffff); }
      else { m.map = tex; }
      m.needsUpdate = true;
      if(typeof m.metalness==='number') m.metalness=Math.min(m.metalness,0.15);
      if(typeof m.roughness==='number') m.roughness=Math.max(m.roughness,0.6);
    }
  });
  saveAssignToStorage();
  debounceMaybeCapture();
}

/* ====== スクショ履歴 ====== */
const MAX_SHOTS = 6;
const shotsBox = $('shots');
let lastShotSig = '';
let shotDebounce;
// 『なし』直後は1回だけ自動スクショを抑止する
let lastOpWasNone = false;

// 今の画面状態の署名（割当+スライダー）
function currentSignature(){
  return targetMats.map(m=>{
    const k = assign[m.uuid];
    return (k && state[k] && state[k].tex) ? `${m.uuid}:${k}` : `${m.uuid}:-`;
  }).join('|');
}

// ★全部の対象マテリアルが「A〜Eのどれかに割り当て済み」かつ「そのスロットに画像がある」かを判定
function allFabricCovered(){
  if (targetMats.length === 0) return false;
  return targetMats.every(m=>{
    const k = assign[m.uuid];
    return !!(k && k !== '—' && state[k] && state[k].tex);
  });
}

function debounceMaybeCapture(){
  clearTimeout(shotDebounce);
  shotDebounce = setTimeout(()=>{
    if (lastOpWasNone){ lastOpWasNone=false; return; } // 『なし』直後は撮らない
    if (!allFabricCovered()) return;                    // ← どこか白が残っていたら撮らない

    const sig = currentSignature();
    if(sig===lastShotSig) return;                       // 同一状態は撮らない
    captureShot(sig);
  }, 250);
}
function captureShot(sig){
  renderer.render(scene,camera);
  const dataUrl = renderer.domElement.toDataURL('image/png');
  const img = new Image();
  img.src = dataUrl;
  img.title = 'クリックで復元';
  const snap = { assign: {...assign} }; // ← sliders は持たない
  img.dataset.snap = JSON.stringify(snap);
  img.onclick = ()=>{
    const s = JSON.parse(img.dataset.snap);
    Object.keys(assign).forEach(k=>delete assign[k]);
    Object.assign(assign, s.assign);
    applyAssignments();
    msg('履歴から復元しました');
  };
  shotsBox.prepend(img);
  while(shotsBox.children.length>MAX_SHOTS) shotsBox.removeChild(shotsBox.lastChild);
  lastShotSig = sig;
}

function showHighlight(mesh){
  hideHighlight();
  if(!mesh || !mesh.geometry) return;
  const mat = new THREE.MeshBasicMaterial({
    color:0xff6b81, transparent:true, opacity:0.35, depthTest:false, depthWrite:false
  });
  overlay = new THREE.Mesh(mesh.geometry, mat);
  overlay.renderOrder = 9999;
  mesh.add(overlay);
}
function hideHighlight(){ if(overlay && overlay.parent){ overlay.parent.remove(overlay); } overlay = null; }
function hideBubble(){ bubble.style.display='none'; }

function setBubbleScreenPos(world){
  const p = world.clone().project(camera);
  const x = (p.x * .5 + .5) * canvas.clientWidth;
  const y = ( -p.y * .5 + .5) * canvas.clientHeight;
  bubble.style.left = `${x}px`;
  bubble.style.top  = `${y}px`;
}

/* 裏面クリック無効 */
const _nm = new THREE.Matrix3();
function isFrontFacing(hit){
  if(!hit.face || !hit.object) return true;
  const n = hit.face.normal.clone().applyMatrix3(_nm.getNormalMatrix(hit.object.matrixWorld)).normalize();
  const camDir = camera.position.clone().sub(hit.point).normalize();
  return n.dot(camDir) > 0.15;
}

function onCanvasClick(ev){
  const r = canvas.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left)/r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top)/r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);

  const targets = []; scene.traverse(o=>{ if(o.isMesh && !o.userData?.ground) targets.push(o); });
  const hits = ray.intersectObjects(targets, true);
  const hit = hits.find(h => h.object && h.object.material && isFrontFacing(h));

  if(!hit){ pick=null; pickMatIndex=null; hideHighlight(); hideBubble(); return; }

  pick = hit.object;
  pickMatIndex = (Array.isArray(pick.material) && hit.face && typeof hit.face.materialIndex==='number') ? hit.face.materialIndex : null;
  showHighlight(pick);

  const wp = hit.point.clone().add(new THREE.Vector3(0, 0.02, 0));
  setBubbleScreenPos(wp);
  bubble.style.display='block';
  controls.update();
}
canvas.addEventListener('pointerdown', onCanvasClick);

/* 同じMaterialを共有していたらクローンして専有化 */
function ensureUniqueMaterialOnMesh(mesh, idx){
  if(Array.isArray(mesh.material)){
    const old = mesh.material[idx]; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material[idx] = clone;
      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone);
      return clone;
    }
    return old;
  }else{
    const old = mesh.material; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material = clone;
      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone);
      return clone;
    }
    return old;
  }
}

/* 吹き出し → 割り当て（クリック面のサブマテリアルのみ） */
function assignToSelected(key){
  if(!pick || !pick.material) return;
  let mat = null;
  if(Array.isArray(pick.material)){
    const idx = (pickMatIndex!=null) ? pickMatIndex : 0;
    mat = ensureUniqueMaterialOnMesh(pick, idx);
  }else{
    mat = ensureUniqueMaterialOnMesh(pick, 0);
  }
  if(!mat) return;

  assign[mat.uuid] = key;
  lastOpWasNone = (key === '—');     // 『なし』はこの操作だけスクショ抑止
  applyAssignments();                // 中で自動スクショ判定
}

/* ループ */
function resize(){ const w=canvas.clientWidth, h=canvas.clientHeight;
  if(canvas.width!==w||canvas.height!==h){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } }
function loop(){
  resize(); controls.update(); renderer.render(scene,camera);
  if(pick && bubble.style.display!=='none'){
    const center = new THREE.Box3().setFromObject(pick).getCenter(new THREE.Vector3());
    setBubbleScreenPos(center);
  }
  requestAnimationFrame(loop);
} loop();
