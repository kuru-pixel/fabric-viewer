
<!doctype html><html><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fabric Viewer</title>
<style>
  /* パネル開閉の矢印ボタンは使わないので非表示にする */
#uiToggle,
#reopen {
  display: none !important;
}

  html,body{margin:0;height:100%;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
            background: #0e0e0e;}
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}

  /* ==== 左パネル ==== */
  #uiWrap{position:fixed;z-index:5;top:0;left:0;height:100%;display:flex;align-items:flex-start;transition:transform .25s ease}
  #ui{
    background:rgba(8,8,8,0.92);
    color:#fff;
    padding:0;
    width:180px;
    height:100vh;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f1f1f;
    backdrop-filter:blur(12px);
  }
  #ui-fixed{
    flex-shrink:0;
    padding: 56px 16px 12px;
    border-bottom:1px solid #1f1f1f;
  }
  #ui-scroll{
    overflow-y:auto;
    flex:1;
    padding:12px 16px;
  }
  #ui-scroll::-webkit-scrollbar{width:3px;}
  #ui-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}

  #ui label{display:block;font-size:10px;margin:6px 0 4px;letter-spacing:0.1em;color:#666}
  .btnRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .mini{margin-left:6px;font-size:12px;padding:2px 6px}

  /* ボタン共通 */
  #ui button, #ui-fixed button {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #aaa;
    border-radius: 2px;
    padding: 7px 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: border-color 0.15s, color 0.15s;
  }
  #ui button:hover, #ui-fixed button:hover {
    border-color: #555;
    color: #fff;
  }

  #uiToggle{display:none}
  #uiWrap.collapsed{transform:translateX(calc(-100% + 32px))}
  .block{margin-top:10px;padding:10px 0 4px;border-top:1px solid #1a1a1a}
  .block h4{margin:0 0 6px 0;font-size:9px;letter-spacing:0.15em;color:#555;text-transform:uppercase}
  #footer{position:fixed;right:10px;bottom:10px;z-index:4;font-size:11px;background:#0b0b0bcc;color:#444;padding:6px 10px;border-radius:2px}
  #msg{position:fixed;z-index:6;bottom:10px;left:50%;transform:translateX(-50%);background:#111;color:#888;padding:6px 12px;border-radius:2px;font-size:11px;letter-spacing:0.05em}

  /* ==== 吹き出し ==== */
  #bubble{position:fixed; z-index:7; display:none; transform:translate(-50%,-115%); pointer-events:auto;
    background:#0e0e0e; color:#fff; border:1px solid #2a2a2a; border-radius:4px; padding:8px 10px; box-shadow:0 8px 24px #0009;}
  #bubble .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:320px}
  #bubble > div:first-child{font-size:9px;letter-spacing:0.15em;color:#555;margin-bottom:6px;text-transform:uppercase}
  .chip{
    position:relative;
    width:52px;
    height:52px;
    border-radius:2px;
    border:1px solid #2a2a2a;
    background:#111 center/cover no-repeat;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:400;
    letter-spacing:.5px;
    transition: border-color 0.15s;
  }
  .chip-tag{
    position:absolute;
    right:3px;
    bottom:3px;
    padding:1px 4px;
    font-size:9px;
    border-radius:1px;
    background:rgba(0,0,0,.85);
    color:#888;
    letter-spacing:0.1em;
  }
  .chip.none{background:#111;font-size:9px;letter-spacing:0.1em;color:#666}
  .chip:hover{border-color:#fff}

  /* ==== 右上：履歴サムネ ==== */
  #shots{position:fixed; z-index:8; top:10px; right:10px; display:flex; gap:6px; flex-direction:row-reverse; pointer-events:auto;}
  #shots img{width:80px; height:80px; object-fit:cover; border-radius:2px; border:1px solid #2a2a2a;background:#111; cursor:pointer;}
  #shots img:hover{ border-color:#fff; }

  /* パネル再表示用ボタン */
  #reopen{display:none}
  body.panel-collapsed #reopen{ display:none; }

  /* ほんのりビネット */
  body::after{content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(1200px 800px at 60% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.06) 100%);mix-blend-mode:multiply;}

  /* ===== 型選択UI（selecting中だけ表示） ===== */
  body.selecting #uiWrap,
  body.selecting #uiToggle,
  body.selecting #reopen,
  body.selecting #shots,
  body.selecting #bubble,
  body.selecting #footer,
  body.selecting #msg,
  body.selecting #presets,
  body.selecting canvas#c { display:none !important; }

  #patternSelect{position:fixed; inset:0; z-index:20; display:none; place-items:center;}
  /* selecting クラスが付いているときだけ表示 */
body.selecting #patternSelect{
  display:grid;
}
/* スマホ用パネルトグルボタン */
#panelToggle{
  display:none;
  position:fixed;
  top:14px;
  right:14px;
  z-index:9999;
  width:36px;
  height:36px;
  border-radius:2px;
  border:1px solid #2a2a2a;
  background:rgba(8,8,8,0.9);
  color:#666;
  font-size:14px;
  cursor:pointer;
  align-items:center;
  justify-content:center;
  letter-spacing:0;
  transition:color 0.15s, border-color 0.15s;
}
#panelToggle:hover{ color:#fff; border-color:#555; }
@media(max-width:640px){
  #panelToggle{ display:flex; }
  body.panel-hidden #uiWrap{ display:none !important; }
  body.panel-hidden #backHomeBtn{ display:none !important; }
}

  #backHomeBtn {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 14px 20px;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: #555;
  background: rgba(8,8,8,0.95);
  border: none;
  border-bottom: 1px solid #1f1f1f;
  cursor: pointer;
  z-index: 9999;
  text-align: left;
  transition: color 0.2s;
  width: 180px;
  text-transform: uppercase;
}
#backHomeBtn:hover { color: #fff; }

  #patternSelect .wrap{width:min(900px, 92vw);}
  #patternSelect{background:#0a0a0a;}
  #patternSelect h1{
    margin:0 0 48px;
    font-weight:300;
    letter-spacing:0.3em;
    font-size:clamp(14px, 2vw, 18px);
    color:#fff;
    text-align:center;
    text-transform:uppercase;
  }
  #patternGrid{display:grid; gap:8px; grid-template-columns: repeat(4, 1fr);}
  .patternCard{
    display:flex;
    flex-direction:column;
    gap:0;
    padding:0;
    border-radius:2px;
    background:#111;
    border:1px solid #1f1f1f;

    overflow:hidden;

  .patternCard:hover{ border-color:#444; }
  .patternCard .name{
    font-size:9px;
    font-weight:400;
    color:#666;
    letter-spacing:0.15em;
    padding:8px 10px;
    text-transform:uppercase;
  }
  .patternCard .thumb{
    aspect-ratio:3/4;
    background:#0e0e0e center/cover no-repeat;
    border-top:1px solid #1a1a1a;
  }
  .patternCard.disabled{ opacity:.3; cursor:not-allowed; }

  /* ==== 下部 プリセットパターン ==== */
#presets{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:5;
}

/* 左パネル固定ヘッダーとスクロールエリア */
#ui-fixed{

}
#ui-scroll::-webkit-scrollbar{width:3px;}

/* D/E/Fスロットはデフォルト非表示 */
.slot-def{ display:none; }
/* RISC-Setupのときだけ表示 */
body.pattern-risc .slot-def{ display:block; }

/* カスタムパターン削除ボタン */
.customPresetCard{ position:relative; }
.customDeleteBtn{

  right:4px;
  width:20px;
  height:20px;

  z-index:10;

  align-items:center;
  justify-content:center;
  padding:0;
  line-height:1;
  transition:border-color 0.15s, color 0.15s;
}
.customDeleteBtn:hover{ border-color:#fff; color:#fff; }

/* スマホ用矢印ナビ */
#presetNav{
  display:none;
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  align-items:center;
  gap:16px;
  background:rgba(10,10,10,0.9);
  border:1px solid #2a2a2a;
  border-radius:2px;
  padding:8px 20px;
}
#presetNav button{
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
  padding:0;
  color:#666;
  line-height:1;
  transition:color 0.15s;
}
#presetNav button:hover{ color:#fff; }
#presetNavLabel{
  font-size:9px;
  font-weight:400;
  letter-spacing:0.15em;
  white-space:nowrap;
  color:#666;
  text-transform:uppercase;
}

/* 生地スロットプレビュー */
.slot-preview{
  width:100%;
  height:44px;
  border-radius:1px;
  background:#1a1a1a center/cover no-repeat;
  margin-bottom:6px;
  font-size:9px;
  color:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #1f1f1f;
  overflow:hidden;
  letter-spacing:0.1em;
}
.slot-preview.has-fabric{ color:transparent; }
.slot-preview-label{
  font-size:9px;
  color:#555;
  margin-bottom:4px;
}

@media(max-width:640px){
  #presets{ display:none !important; }
  #presetNav{ display:flex; }
}

.presetCard{
  position:relative;
  width:160px;      /* ちょい大きく */
  height:110px;     /* ちょい大きく */
  border-radius:10px;
  border:1px solid #0002;
  background:#fff;  /* 背景を白に */
  cursor:pointer;
  overflow:hidden;
  opacity:.9;
}
.presetCard.active{
  opacity:1;
}

/* サムネ画像部分（白背景＋服を少し大きめに見せる） */
.presetThumb{
  position:absolute;
  inset:0;

  /* 背景は白のまま */
  background-color:#fff;

  /* ★ここがポイント */
  background-position:center;
  background-repeat:no-repeat;

  /* cover → contain だと小さくなるので使わない */
  background-size: 300% auto; /* ← これで服だけ大きく見える */
}

/* 下部のラベル（このままでOK） */
.presetLabel{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:4px 6px;
  font-size:11px;
  color:#000;
  text-align:center;
  background:linear-gradient(to top, rgba(255,255,255,.9), rgba(255,255,255,0));
}

.presetCard.active .presetThumb{
  outline:2px solid #000;
}

  
</style>
</head>

<script>
var _fabricPresetCache = new Map(); // hoisted cache to avoid TDZ
/* ========= 基本 ========= */
let GLB_PATH = null;
const $ = (id)=>document.getElementById(id);

// ===== URLパラメータ（生地IDと型ID） =====
const params = new URLSearchParams(window.location.search);
const fabricsParam = params.get('fabrics') || '';        // 例: "S-100,S-101,S-102"
const patternParam = params.get('pattern') || 'RI-3';    // 無ければ RI-3

// いま表示している型（RI-1, RI-2, RI-3, RI-4 など）
let currentPatternId = patternParam;

// ID → 画像パスを自動で組み立てる
const FABRIC_EXT = '.jpg';
function fabricIdToUrl(id) {
  return `./assets/fabrics/${id}${FABRIC_EXT}`;
}

// 型ごとの定義
const PATTERNS = {
  'RI-1': { glb: './assets/ri-1.glb', thumb: null, slots: ['A','B','C'] },
  'RI-2': { glb: './assets/ri-2.glb', thumb: null, slots: ['A','B','C'] },
  'RI-3': { glb: './assets/ri-3.glb', thumb: null, slots: ['A','B','C'] },
  'RI-4': { glb: './assets/ri-4.glb', thumb: null, slots: ['A','B','C'] },
  'RI-5': { glb: './assets/ri-5.glb', thumb: null, slots: ['A','B','C'] },
  'RISC-Setup': { glb: './assets/risc-setup.glb', thumb: null, slots: ['A','B','C','D','E','F'] },
};

function getSlots(){
  const def = PATTERNS[currentPatternId];
  return (def && Array.isArray(def.slots) && def.slots.length) ? def.slots : ['A','B','C'];
}

// URL から渡ってきた生地ID（スロット数に合わせる）
const EMPTY = "-";
const initialFabrics = fabricsParam
  ? fabricsParam
      .split(',')
      .map(s => String(s || "").trim())
      .slice(0, getSlots().length)
      .map(s => (!s || s === EMPTY || s.toLowerCase() === "null") ? null : s.toUpperCase())
  : [];

// 各スロットに今どの生地IDが入っているか
let slotFabricIds = {}; // ★動的に作る
getSlots().forEach((k, i)=>{
  slotFabricIds[k] = initialFabrics[i] || null;
});

/* three.js */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
if (renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene(); scene.background = null;
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100); camera.position.set(0,1.6,3.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x223,0.45));

const dir = new THREE.DirectionalLight(0xfff2e0, 0.85);
dir.castShadow = true;
dir.position.set(1, 1, 1).multiplyScalar(10);
const camAim = new THREE.Object3D(); camAim.position.set(0,0,-1); camera.add(camAim);
dir.target = camAim; camera.add(dir);
dir.shadow.mapSize.set(1024,1024); dir.shadow.camera.near=0.1; dir.shadow.camera.far=20; dir.shadow.bias=-0.0005;

const rim  = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(0,3,-4); scene.add(rim);

// ----- 影用ユーティリティ -----
function enableShadows(root){
  root.traverse(o=>{
    if(o.isMesh){ o.castShadow = true; o.receiveShadow = false; }
  });
}

let ground;
function addGroundUnder(root){
  if(ground && ground.parent) ground.parent.remove(ground);
  const box = new THREE.Box3().setFromObject(root);
  const minY = box.min.y;
  const g = new THREE.PlaneGeometry(20, 20);
  const m = new THREE.ShadowMaterial({ opacity: 0.25 });
  ground = new THREE.Mesh(g, m);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, minY - 0.002, 0);
  ground.receiveShadow = true;
  ground.userData.ground = true;
  scene.add(ground);
}

function isSupportedMat(m){
  return !!m && (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial || m.isMeshLambertMaterial || m.isMeshPhongMaterial || m.isMeshBasicMaterial);
}
const materialUseCount = new Map();
function analyze(root){
  const mats=new Set(); materialUseCount.clear();
  root.traverse(o=>{
    if(o.isMesh && o.material){
      if(Array.isArray(o.material)){
        o.material.forEach(m=>{ if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }});
      }else{
        const m=o.material; if(m){ mats.add(m); materialUseCount.set(m.uuid,(materialUseCount.get(m.uuid)||0)+1); }
      }
    }
  });
  targetMats = Array.from(mats).filter(isSupportedMat);

  // snapshot originals so unassigned mats (buttons/topstitch etc) can be restored
  origMatState = new Map();
for (const m of targetMats) {
  origMatState.set(m.uuid, {
    map: m.map || null,
    color: (m.color && m.color.clone) ? m.color.clone() : null,

    metalness: (typeof m.metalness === 'number') ? m.metalness : undefined,
    roughness: (typeof m.roughness === 'number') ? m.roughness : undefined,

    // ★ここが崩れてた
    normalMap: m.normalMap || null,
    roughnessMap: m.roughnessMap || null,
    metalnessMap: m.metalnessMap || null,
    normalScale: (m.normalScale && m.normalScale.clone) ? m.normalScale.clone() : null,

    aoMap: m.aoMap || null,
    emissiveMap: m.emissiveMap || null,
    emissive: (m.emissive && m.emissive.clone) ? m.emissive.clone() : null,

    alphaMap: m.alphaMap || null,
    transparent: !!m.transparent,
    opacity: (typeof m.opacity === 'number') ? m.opacity : 1
  });
}



  updateMatInfo();
}

  const box=new THREE.Box3().setFromObject(obj),

// Allow fallback for fabrics stored as "<id>_1.jpg" etc.
function loadTexByFabricId(key, id){
  id = String(id || "").trim();
  id = id.replace(/_([0-9]+)$/i, "");   // "_1" "_2" を剥がす
  id = id.toUpperCase();

  // _2 → _1 → 通常 の順
  const stems = [`${id}_2`, `${id}_1`, `${id}`];

  // ★追加：拡張子/大文字小文字もフォールバック（GitHub Pagesは大小区別される）
  const exts = ["jpg", "JPG", "jpeg", "png", "webp"];

  const urls = [];
  for(const s of stems){
    for(const ext of exts){
      urls.push(`./assets/fabrics/${s}.${ext}`);
    }
  }

  const tryLoad = (i)=>{
    if(i >= urls.length){
      msg(`生地画像が見つかりません: ${id}`);
      return;
    }
    loadTexFromUrlFor(key, urls[i], (err)=>{
      if(err) return tryLoad(i+1);
      // 成功した実URLをログに残す（あとで整理しやすい）
      console.log("[FABRIC OK]", key, urls[i]);
    });
  };

  tryLoad(0);
}


function normalizeFabricId(id){
  id = String(id || "").trim();
  // URL/パスが来てもOK（最後の要素だけ使う）
  try{ id = id.split('?')[0].split('#')[0]; }catch(e){}
  if(id.includes('/')) id = id.split('/').pop();
  // 拡張子を剥がす（jpg/png/webp/glb等が来てもIDに揃える）
  id = id.replace(/\.(glb|gltf|jpg|jpeg|png|webp)$/i, "");
  // 末尾の _数字 を剥がす（S-100_1 → S-100）
  id = id.replace(/_([0-9]+)$/i, "");
  return id.toUpperCase();
}

function prepTexture(t){
  if(!t) return;
  if (t.colorSpace!==undefined) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
}

const FAB_PRESET_DIR = './assets/fabric-presets/';
_fabricPresetCache = new Map(); // id -> Promise(preset)
function _computeUvRepeatFromMesh(mesh){
  try{
    const uv = mesh.geometry?.attributes?.uv;
    if(!uv) return { x: 1, y: 1 };

    let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
    for(let i=0; i<uv.count; i++){
      const u = uv.getX(i), v = uv.getY(i);
      if(u < minU) minU = u; if(u > maxU) maxU = u;
      if(v < minV) minV = v; if(v > maxV) maxV = v;
    }

    const rx = Math.max(1, maxU - minU);
    const ry = Math.max(1, maxV - minV);

    // だいたい整数になるはずなので丸め（CLO出力の誤差対策）
    return { x: Math.round(rx * 100) / 100, y: Math.round(ry * 100) / 100 };
  }catch(e){
    return { x: 1, y: 1 };
  }
}

function loadFabricPresetById(fabricId){
  const id = String(fabricId || '').trim();
  if(!id) return Promise.reject(new Error('fabricId empty'));

  if(_fabricPresetCache.has(id)) return _fabricPresetCache.get(id);

  const p = new Promise((resolve, reject) => {
    const url = `${FAB_PRESET_DIR}${id}.glb`;

    // 既に使ってる loader があるならそれを使ってOK
    const loader = new THREE.GLTFLoader();

    loader.load(url, (gltf) => {
      let mesh = null;

      gltf.scene.traverse((o) => {
        if(!mesh && o && o.isMesh) mesh = o;
      });

      if(!mesh) return reject(new Error(`No mesh in preset glb: ${url}`));

      const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      if(!mat) return reject(new Error(`No material in preset glb: ${url}`));

      const uvRepeat = _computeUvRepeatFromMesh(mesh);

      resolve({
        id,
        uvRepeat,            // ★これが「2cmなら5回」みたいな根拠になり得る
        material: mat        // PBRマップをここから取る
      });
    }, undefined, (err) => reject(err));
  });

  _fabricPresetCache.set(id, p);
  return p;
}


function _cloneTexWithRepeat(srcTex, uvRepeat){
  if(!srcTex) return null;

  const t = srcTex.clone();
  t.image = srcTex.image; // 参照維持

  // wrapはRepeat前提（タイルさせる）
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;

  // 既にKHR_texture_transform等でrepeatが入ってる場合は“掛け算”
  const baseRx = (t.repeat?.x ?? 1);
  const baseRy = (t.repeat?.y ?? 1);
  if(t.repeat) t.repeat.set(baseRx * uvRepeat.x, baseRy * uvRepeat.y);

  t.needsUpdate = true;
  return t;
}

function applyPresetToMaterial(dstMat, preset){
  const src = preset?.material;
  if(!dstMat || !src) return;

  // 色で潰れるのを避ける（ベースカラーを白）
  if(dstMat.color) dstMat.color.set(0xffffff);

  // map類（存在するものだけ）
  dstMat.map = _cloneTexWithRepeat(src.map, preset.uvRepeat);
  dstMat.normalMap = _cloneTexWithRepeat(src.normalMap, preset.uvRepeat);
  dstMat.roughnessMap = _cloneTexWithRepeat(src.roughnessMap, preset.uvRepeat);
  dstMat.metalnessMap = _cloneTexWithRepeat(src.metalnessMap, preset.uvRepeat);
  dstMat.aoMap = _cloneTexWithRepeat(src.aoMap, preset.uvRepeat);
  dstMat.alphaMap = _cloneTexWithRepeat(src.alphaMap, preset.uvRepeat);
  dstMat.emissiveMap = _cloneTexWithRepeat(src.emissiveMap, preset.uvRepeat);

  // 数値系（あるならコピー）
  if(typeof src.roughness === 'number') dstMat.roughness = src.roughness;
  if(typeof src.metalness === 'number') dstMat.metalness = src.metalness;

  if(src.normalScale && dstMat.normalScale) dstMat.normalScale.copy(src.normalScale);

  // 透過系（必要なら）
  if(typeof src.transparent === 'boolean') dstMat.transparent = src.transparent;
  if(typeof src.opacity === 'number') dstMat.opacity = src.opacity;
  if(typeof src.alphaTest === 'number') dstMat.alphaTest = src.alphaTest;

  dstMat.needsUpdate = true;
}



  
  
function applyAssignments(){
  targetMats.forEach(m=>{
    const key = assign[m.uuid]; // 'A'|'B'|'C'|'—'|undefined
    const st = (key && state[key]) ? state[key] : null;
    const preset = (key && st) ? st.preset : null;
    const tex = (key && st) ? st.tex : null; // フォールバック用（JPG）

    if(!isSupportedMat(m)) return;

    // ---- なし or 未割当：元のGLB状態へ戻す ----
    if(!key || key === '—' || (!preset && !tex)){
      const orig = origMatState.get(m.uuid);
      if(orig){
        m.map = orig.map || null;
        if(m.color){
          if(orig.color) m.color.copy(orig.color);
          else m.color.set(0xffffff);
        }
        if(typeof orig.metalness==='number') m.metalness = orig.metalness;
        if(typeof orig.roughness==='number') m.roughness = orig.roughness;

        m.normalMap = orig.normalMap || null;
        m.roughnessMap = orig.roughnessMap || null;
        m.metalnessMap = orig.metalnessMap || null;
        if(m.normalScale && orig.normalScale) m.normalScale.copy(orig.normalScale);

        m.aoMap = orig.aoMap || null;
        m.emissiveMap = orig.emissiveMap || null;
        if(m.emissive && orig.emissive) m.emissive.copy(orig.emissive);

        m.alphaMap = orig.alphaMap || null;
        m.transparent = !!orig.transparent;
        m.opacity = (typeof orig.opacity === 'number') ? orig.opacity : 1;
      }else{
        m.map = null;
        if(m.color) m.color.set(0xffffff);
      }
      m.needsUpdate = true;
      return;
    }

    // ---- 優先：プリセットGLB（材質）を適用 ----
    if(preset){
      applyPresetToMaterial(m, preset);

      // 布が真っ黒になりやすいのを防ぐ（環境マップ無しでも破綻しにくい）
      if(typeof m.metalness === 'number') m.metalness = 0;
      if(typeof m.roughness === 'number') m.roughness = Math.max(m.roughness, 0.75);

      m.needsUpdate = true;
      return;
    }

    // ---- フォールバック：JPG（従来方式） ----
    const orig = origMatState.get(m.uuid);
    if(orig){
      m.normalMap   = orig.normalMap;
      m.aoMap       = orig.aoMap;
      m.emissiveMap = orig.emissiveMap;
      m.alphaMap    = orig.alphaMap;
      if (m.emissive && orig.emissive) m.emissive.copy(orig.emissive);
      if (typeof orig.metalness === 'number') m.metalness = orig.metalness;
      if (typeof orig.roughness === 'number') m.roughness = orig.roughness;
      m.transparent = orig.transparent;
      m.opacity     = orig.opacity;
    }

    if (orig && orig.map && tex) {
      tex.wrapS = orig.map.wrapS;
      tex.wrapT = orig.map.wrapT;
      if (tex.repeat && orig.map.repeat) tex.repeat.copy(orig.map.repeat);
      if (tex.offset && orig.map.offset) tex.offset.copy(orig.map.offset);
      if (typeof orig.map.rotation === "number") tex.rotation = orig.map.rotation;
      if (tex.center && orig.map.center) tex.center.copy(orig.map.center);
      tex.needsUpdate = true;
    }

    m.map = tex;
    if (m.color) m.color.set(0xffffff);
    m.needsUpdate = true;
  });

  saveAssignToStorage();
  debounceMaybeCapture();
  // スロットプレビューを更新（⑤）
  if(typeof updateSlotPreviews === 'function') updateSlotPreviews();
}

const MAX_SHOTS = 6;
const shotsBox = $('shots');
let lastShotSig = '';
let shotDebounce;
let lastOpWasNone = false;

function currentSignature(){
  return targetMats.map(m=>{
    const k = assign[m.uuid];
    return (k && state[k] && state[k].tex) ? `${m.uuid}:${k}` : `${m.uuid}:-`;
  }).join('|');
}
function allFabricCovered(){
  if (targetMats.length === 0) return false;
  return targetMats.every(m=>{
    const k = assign[m.uuid];
    return !!(k && k !== '—' && state[k] && state[k].tex);
  });
}
function debounceMaybeCapture(){
  clearTimeout(shotDebounce);
  shotDebounce = setTimeout(()=>{
    if (lastOpWasNone){ lastOpWasNone=false; return; }
    if (!allFabricCovered()) return;
    const sig = currentSignature();
    if(sig===lastShotSig) return;
    captureShot(sig);
  }, 250);
}
function captureShot(sig){
  renderer.render(scene,camera);
  const dataUrl = renderer.domElement.toDataURL('image/png');
  const img = new Image();
  img.src = dataUrl;
  img.title = 'クリックで復元';
  const snap = { assign: {...assign} };
  img.dataset.snap = JSON.stringify(snap);
  img.onclick = ()=>{
    const s = JSON.parse(img.dataset.snap);
    Object.keys(assign).forEach(k=>delete assign[k]);
    Object.assign(assign, s.assign);
    applyAssignments();
    msg('履歴から復元しました');
  };
  shotsBox.prepend(img);
  while(shotsBox.children.length>MAX_SHOTS) shotsBox.removeChild(shotsBox.lastChild);
  lastShotSig = sig;
}

const _nm = new THREE.Matrix3();
function isFrontFacing(hit){
  if(!hit.face || !hit.object) return true;
  const n = hit.face.normal.clone().applyMatrix3(_nm.getNormalMatrix(hit.object.matrixWorld)).normalize();
  const camDir = camera.position.clone().sub(hit.point).normalize();
  return n.dot(camDir) > 0.15;
}
function showHighlight(mesh){
  hideHighlight();
  if(!mesh || !mesh.geometry) return;
  const mat = new THREE.MeshBasicMaterial({color:0xff6b81, transparent:true, opacity:0.35, depthTest:false, depthWrite:false});
  overlay = new THREE.Mesh(mesh.geometry, mat);
  overlay.renderOrder = 9999; mesh.add(overlay);
}
function hideHighlight(){ if(overlay && overlay.parent){ overlay.parent.remove(overlay); } overlay = null; }

function onCanvasClick(ev){
  const r = canvas.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left)/r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top)/r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const targets = []; scene.traverse(o=>{ if(o.isMesh && !o.userData?.ground) targets.push(o); });
  const hits = ray.intersectObjects(targets, true);
  const hit = hits.find(h => h.object && h.object.material && isFrontFacing(h));
  if(!hit){ pick=null; pickMatIndex=null; hideHighlight(); hideBubble(); return; }
  pick = hit.object;
  pickMatIndex = (Array.isArray(pick.material) && hit.face && typeof hit.face.materialIndex==='number') ? hit.face.materialIndex : null;
  showHighlight(pick);
  const wp = hit.point.clone().add(new THREE.Vector3(0, 0.02, 0));
  setBubbleScreenPos(wp); bubble.style.display='block'; controls.update();
}

function ensureUniqueMaterialOnMesh(mesh, idx){
  if(Array.isArray(mesh.material)){
    const old = mesh.material[idx]; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material[idx] = clone;
      
      const snap = origMatState && origMatState.get(old.uuid);
if (snap && !origMatState.has(clone.uuid)) {
  origMatState.set(clone.uuid, {
    ...snap,
    color: snap.color?.clone?.() ?? null,
    emissive: snap.emissive?.clone?.() ?? null,
    normalScale: snap.normalScale?.clone?.() ?? null,
  });
}

      
      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone); return clone;
    } return old;
  }else{
    const old = mesh.material; if(!old) return null;
    const count = materialUseCount.get(old.uuid)||0;
    if(count > 1){
      const clone = old.clone(); mesh.material = clone;

      const snap = origMatState && origMatState.get(old.uuid);
if (snap && !origMatState.has(clone.uuid)) {
  origMatState.set(clone.uuid, {
    ...snap,
    color: snap.color?.clone?.() ?? null,
    emissive: snap.emissive?.clone?.() ?? null,
    normalScale: snap.normalScale?.clone?.() ?? null,
  });
}

      materialUseCount.set(old.uuid, count-1); materialUseCount.set(clone.uuid, 1);
      if(isSupportedMat(clone)) targetMats.push(clone); return clone;
    } return old;
  }
}

const MAX_CUSTOM_PATTERNS = 50;
const BASE_PATTERN_COUNT = 6; // デフォルトパターン数

// セッション中のカスタムパターン保存（ページ閉じたらリセット）
// { id: number, label: string, assign: {}, patternId: string, slotFabricIds: {} }
let customPatterns = [];
let nextCustomId = 7; // 次に保存するパターン番号
let isCustomModified = false; // 個別変更フラグ

function markCustomModified(){
  if(customPatterns.length >= MAX_CUSTOM_PATTERNS) return;
  isCustomModified = true;
  updateSavePatternBtn();
}

function updateSavePatternBtn(){
  const btn = document.getElementById('saveCustomPatternBtn');
  if(!btn) return;
  if(isCustomModified){
    btn.style.display = 'block';
    btn.textContent = `パターン${nextCustomId}として保存`;
  } else {
    btn.style.display = 'none';
  }
}

function saveCustomPattern(){
  if(!isCustomModified) return;
  if(customPatterns.length >= MAX_CUSTOM_PATTERNS){ msg('保存上限（50）に達しています'); return; }

  const id = nextCustomId;
  const label = `パターン${id}`;

  // 現在のassignとslotFabricIdsをスナップショット
  const snapAssign = { ...assign };
  const snapSlots = { ...slotFabricIds };
  const snapPatternId = currentPatternId;

  customPatterns.push({ id, label, assign: snapAssign, slotFabricIds: snapSlots, patternId: snapPatternId });

  nextCustomId++;
  isCustomModified = false;
  updateSavePatternBtn();

  // 下部サムネに追加
  addCustomPresetCard(customPatterns[customPatterns.length - 1]);
  msg(`${label} を保存しました`);
}

function deleteCustomPattern(id){
  const idx = customPatterns.findIndex(p => p.id === id);
  if(idx === -1) return;
  customPatterns.splice(idx, 1);

  // 対応するサムネカードを削除
  const card = document.getElementById(`customCard-${id}`);
  if(card) card.remove();

  msg(`パターン${id} を削除しました`);
}

function applyCustomPattern(p){
  // 型が違う場合はスキップ
  if(p.patternId !== currentPatternId){
    msg('この型では使えないパターンです');
    return;
  }
  // assignを復元
  Object.keys(assign).forEach(k => delete assign[k]);
  Object.assign(assign, p.assign);
  applyAssignments();
  isCustomModified = false;
  updateSavePatternBtn();
  msg(`${p.label} を適用しました`);
}

const PATTERN_PERMS = [
  { label: 'パターン1 (A-B-C)', Z1: 'A', Z2: 'B', Z3: 'C' },
  { label: 'パターン2 (A-C-B)', Z1: 'A', Z2: 'C', Z3: 'B' },

  { label: 'パターン5 (C-A-B)', Z1: 'C', Z2: 'A', Z3: 'B' },
  { label: 'パターン6 (C-B-A)', Z1: 'C', Z2: 'B', Z3: 'A' },
];

// 6ゾーン用（RISC-Setup）：Z1〜Z6にA〜Fを1対1で割当（固定）
const PATTERN_PERMS_6 = [
  { label: 'パターン1', Z1:'A', Z2:'B', Z3:'C', Z4:'D', Z5:'E', Z6:'F' },
];

/**
 * 指定パターン番号 (0〜5) を適用
 */
function applyPatternByIndex(index) {
  const isRISC = currentPatternId === 'RISC-Setup';
  const perms = isRISC ? PATTERN_PERMS_6 : PATTERN_PERMS;
  const perm = perms[Math.min(index, perms.length - 1)];
  if (!perm) return;

  Object.keys(assign).forEach(k => { delete assign[k]; });

  const MAT_ZONE = MAT_ZONE_BY_PATTERN[currentPatternId] || {};
  
  
function __resolveZoneForMat(m){
  if(!m) return null;

  // name（GLB由来）を先に正規化
  const raw = (m.name || '');
  const n = String(raw).trim();

  // ★ボタン等はゾーン対象外（今回のキモ）
  if(/^Default Button\b/i.test(n)) return null;

  // ★優先順位：name → uuid（uuidはクローン等で変わりやすいので後）
  if(MAT_ZONE[raw]) return MAT_ZONE[raw];
  if(MAT_ZONE[n]) return MAT_ZONE[n];

  // ".001" / " Copy ..." などの揺れを落として再トライ
  const base = n
    .replace(/\.(\d+)$/, '')
    .replace(/_([0-9]+)$/, '') // ← 追加: "_1" みたいなBlender/書き出し揺れ対応
    .replace(/\s+Copy.*$/i, '')
    .trim();

  if(MAT_ZONE[base]) return MAT_ZONE[base];

  // プレフィックス一致（末尾に .001 等が付くケース）
  for(const k in MAT_ZONE){
    if(!k) continue;
    if(n === k || n.startsWith(k)) return MAT_ZONE[k];
  }
  for(const k in MAT_ZONE){
    if(!k) continue;
    if(base === k || base.startsWith(k)) return MAT_ZONE[k];
  }

  // 最後の保険：uuid
  if(m.uuid && MAT_ZONE[m.uuid]) return MAT_ZONE[m.uuid];

  return null;
}


  targetMats.forEach(m => {
    let zone = __resolveZoneForMat(m);

      const slot = perm[zone];
    assign[m.uuid] = slot || '—';
  });
  
  applyAssignments();
  msg(perm.label + ' を適用しました');
}


function capturePresetThumb(index){
  if (!model) return;
  const card = presetsEl.children[index];
  if (!card) return;
  const thumbEl = card.querySelector('.presetThumb');
  if (!thumbEl) return;

  // いまのカメラ状態を退避
  const oldPos    = camera.position.clone();
  const oldTarget = controls.target.clone();

  // モデルのバウンディングボックスからカメラ位置を自動計算
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist   = maxDim * 3.0;

  const thumbTarget = new THREE.Vector3(center.x, center.y, center.z);
  const thumbPos    = new THREE.Vector3(center.x + dist * 0.2, center.y, center.z + dist);

  camera.position.copy(thumbPos);
  controls.target.copy(thumbTarget);
  controls.update();

  // 1枚レンダリングしてデータURL取得
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');

  // カードの背景に貼る
  thumbEl.style.backgroundImage = `url(${url})`;

  // カメラ状態を元に戻す
  camera.position.copy(oldPos);
  controls.target.copy(oldTarget);
  controls.update();
}

  // selecting を外して3D表示へ
  document.body.classList.remove('selecting');
  GLB_PATH = def.glb;
  loadModel(GLB_PATH);
// ★追加：URLにfabricsがある場合、プリセットGLBを先に読み込み（モデル読込後に適用される）
syncPresetsFromSlotIds();
})();

// GLBから2Dサムネを生成（フォールバック）
function makeThumbFromGLB(glbPath, targetEl){
  const r = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  const W=360, H=270; r.setSize(W,H,false); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0xffffff);
  const cam = new THREE.PerspectiveCamera(20, W/H, 0.1, 100);
  sc.add(new THREE.HemisphereLight(0xffffff,0x223,0.6));
  const dl  = new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(2,3,5); sc.add(dl);

  const ld = new THREE.GLTFLoader();
  ld.load(glbPath, (glb)=>{
    const obj = glb.scene; sc.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    const radius = Math.max(size.x, size.y, size.z) * 0.6;
    cam.position.set(0, 0.1*size.y, radius*3.0);
    cam.lookAt(0,0,0); cam.updateProjectionMatrix();
    r.render(sc, cam);
    targetEl.style.backgroundImage = `url(${r.domElement.toDataURL('image/png')})`;
    r.dispose();
  }, undefined, ()=>{});
}

/* ===== 生地アップロード機能（viewer側）===== */
(function(){
  const fileInput  = document.getElementById('fabricFileInputViewer');
  const uploadBtn  = document.getElementById('uploadFabricBtnViewer');
  const modal      = document.getElementById('viewerUploadModal');
  const slotBtns   = document.getElementById('viewerUploadSlotBtns');
  const cancelBtn  = document.getElementById('viewerUploadCancel');

  if(!fileInput || !uploadBtn) return;

  let pendingDataUrl = null;

  // HEICをJPGに変換
  async function convertHeicToJpeg(file){
    if(!window.heic2any){
      await new Promise((resolve, reject)=>{
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    return await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
  }

  async function fileToDataUrl(file){
    const name = file.name.toLowerCase();
    const isHeic = name.endsWith('.heic') || name.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';
    let target = file;
    if(isHeic){
      try{ target = await convertHeicToJpeg(file); }
      catch(e){ msg('HEICの変換に失敗しました。JPG/PNGをお試しください。'); return null; }
    }
    return new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(target);
    });
  }

  // アップロード画像をスロットに適用する
  function applyUploadedImageToSlot(dataUrl, slot){
    const loader = new THREE.TextureLoader();
    loader.load(dataUrl, tex=>{
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // stateにセット（presetの代わりにtexとして扱う）
      if(!state[slot]) state[slot] = {};
      state[slot].tex = tex;
      state[slot].url = dataUrl;
      state[slot].preset = null; // GLBプリセットはクリア
      slotFabricIds[slot] = `UPLOAD_${slot}`;

      applyAssignments();
      updateSlotPreviews();
      msg(`生地${slot}にアップロード画像を適用しました`);
    });
  }

  // モーダルのスロットボタンを現在のスロット構成に合わせて生成
  function buildSlotBtns(){
    slotBtns.innerHTML = '';
    getSlots().forEach(slot=>{
      const btn = document.createElement('button');
      btn.textContent = slot;
      btn.style.cssText = 'width:52px;height:52px;border:1px solid #333;background:transparent;color:#fff;font-size:1rem;letter-spacing:0.1em;cursor:pointer;border-radius:2px;transition:border-color 0.15s,background 0.15s;';
      btn.addEventListener('mouseenter', ()=>{ btn.style.borderColor='#fff'; btn.style.background='#fff'; btn.style.color='#000'; });
      btn.addEventListener('mouseleave', ()=>{ btn.style.borderColor='#333'; btn.style.background='transparent'; btn.style.color='#fff'; });
      btn.addEventListener('click', ()=>{
        modal.style.display = 'none';
        if(pendingDataUrl) applyUploadedImageToSlot(pendingDataUrl, slot);
        pendingDataUrl = null;
      });
      slotBtns.appendChild(btn);
    });
  }

  uploadBtn.addEventListener('click', ()=> fileInput.click());

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    fileInput.value = '';
    pendingDataUrl = await fileToDataUrl(file);
    if(!pendingDataUrl) return;
    buildSlotBtns();
    modal.style.display = 'flex';
  });

  cancelBtn.addEventListener('click', ()=>{
    modal.style.display = 'none';
    pendingDataUrl = null;
  });

  // BASE側からsessionStorageで渡されたアップロード画像を受け取る
  try{
    const uploadSlot = sessionStorage.getItem('uploadedFabricSlot');
    if(uploadSlot){
      const dataUrl = sessionStorage.getItem(`uploadedFabric_${uploadSlot}`);
      if(dataUrl){
        sessionStorage.removeItem('uploadedFabricSlot');
        sessionStorage.removeItem(`uploadedFabric_${uploadSlot}`);
        // モデルが読み込まれてから適用
        const waitAndApply = setInterval(()=>{
          if(model){
            clearInterval(waitAndApply);
            applyUploadedImageToSlot(dataUrl, uploadSlot);
          }
        }, 300);
      }
    }
  }catch(e){}
})();

/* ===== 生地スロットプレビュー更新 ===== */
function updateSlotPreviews(){
  ['A','B','C','D','E','F'].forEach(slot => {
    const el = document.getElementById(`slotPreview-${slot}`);
    if(!el) return;
    const id = slotFabricIds[slot];
    if(id){
      el.style.backgroundImage = `url('./assets/fabrics/${id}.jpg')`;
      el.classList.add('has-fabric');
      el.textContent = id;
    } else {
      el.style.backgroundImage = '';
      el.classList.remove('has-fabric');
      el.textContent = '未選択';
    }
  });
}

let currentPresetIndex = 0;
function updatePresetNav(){
  const cards = document.querySelectorAll('.presetCard2, #presets .presetCard');
  const total = cards.length;
  if(!total) return;
  const label = document.getElementById('presetNavLabel');
  const activeCard = cards[currentPresetIndex];
  if(label && activeCard){
    const lbl = activeCard.querySelector('.presetLabel');
    label.textContent = lbl ? lbl.textContent : `パターン${currentPresetIndex+1}`;
  }
  cards.forEach((c,i) => c.classList.toggle('active', i === currentPresetIndex));
  // アクティブパターンを適用
  applyPatternByIndex(currentPresetIndex);
  setActivePreset(currentPresetIndex);
}

  const total = document.querySelectorAll('#presets .presetCard').length;
  if(!total) return;
  currentPresetIndex = (currentPresetIndex - 1 + total) % total;
  updatePresetNav();
});
document.getElementById('presetNext').addEventListener('click', () => {
  const total = document.querySelectorAll('#presets .presetCard').length;
  if(!total) return;
  currentPresetIndex = (currentPresetIndex + 1) % total;

});
